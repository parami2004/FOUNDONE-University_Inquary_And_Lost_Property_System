<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Authentication - University Inquiry System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css?v=99">
</head>
<body>

  
    <nav class="navbar navbar-expand-lg navbar-dark bg-university shadow-sm sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="index.html">FOUNDONE</a>
            <div class="collapse navbar-collapse id="navbarNav"">
                <ul class="navbar-nav ms-auto fw-semibold">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link" href="report.html">Lost & Found</a></li>
                    <li class="nav-item"><a class="nav-link" href="dashboard.html">Dashboard</a></li>
                </ul>
            </div>
        </div>
    </nav>

  
    <main class="container my-5">
        <div class="row g-5 align-items-stretch">
            
            <div class="col-md-5">
                <div class="card shadow h-100 p-4 border-top border-4 border-university">
                    <h2 class="fw-bold mb-4 text-center text-university">Login</h2>
                    <form action="#" method="POST">
                        <div class="mb-3">
                            <label for="loginEmail" class="form-label fw-semibold">Email address</label>
                            <input type="email" class="form-control" id="loginEmail" required placeholder="Enter university email">
                        </div>
                        <div class="mb-4">
                            <label for="loginPassword" class="form-label fw-semibold">Password</label>
                            <input type="password" class="form-control" id="loginPassword" required placeholder="Enter password">
                        </div>
                        <button type="submit" class="btn btn-university w-100 fw-bold shadow-sm py-2">LOGIN</button>
                    </form>
                </div>
            </div>

            
            <div class="col-md-2 d-none d-md-flex align-items-center justify-content-center position-relative">
                <div class="vr h-75 bg-secondary opacity-25"></div>
            </div>

        
            <div class="col-md-5">
                <div class="card shadow h-100 p-4 border-top border-4 border-warning">
                    <h2 class="fw-bold mb-4 text-center text-dark">Register</h2>
                    <form id="registrationForm" novalidate>
                        <div class="mb-3">
                            <label for="regUsername" class="form-label fw-semibold">Username</label>
                            <input type="text" class="form-control" id="regUsername" required placeholder="Choose username">
                        </div>
                        <div class="mb-3">
                            <label for="regEmail" class="form-label fw-semibold">Email</label>
                            <input type="email" class="form-control" id="regEmail" required placeholder="name@university.lk">
                        </div>
                        <div class="mb-3">
                            <label for="regPassword" class="form-label fw-semibold">Password</label>
                            <input type="password" class="form-control" id="regPassword" required placeholder="Create secure password">
                        </div>
                        <div class="mb-4">
                            <label for="regConfirmPassword" class="form-label fw-semibold">Confirm Password</label>
                            <input type="password" class="form-control" id="regConfirmPassword" required placeholder="Repeat password">
                            <div class="invalid-feedback">Passwords do not match.</div>
                        </div>
                        <button type="submit" class="btn btn-warning w-100 fw-bold shadow-sm py-2 text-dark">Register</button>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <footer class="bg-dark text-white text-center py-4 border-top border-warning border-3 mt-auto">
        <div class="container">
            <p class="mb-0">&copy; 2026 University Service Management Web Application.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/js/main.js"></script>
</body>
</html>
