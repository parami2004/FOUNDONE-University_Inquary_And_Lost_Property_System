<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Report Lost or Found Item - UniLostFound</title>
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom Style -->
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
        }
        .navbar-dark {
            background-color: #1a1a1a;
        }
        .card-custom {
            background-color: #1e1e1e;
            border: 1px solid #2d2d2d;
        }
        .form-control, .form-select {
            background-color: #2b2b2b;
            border: 1px solid #3d3d3d;
            color: #fff;
        }
        .form-control:focus, .form-select:focus {
            background-color: #333;
            color: #fff;
            border-color: #0d6efd;
            box-shadow: none;
        }
    </style>
</head>
<body>

    <!-- Navigation Bar (Present on all pages) -->
    <nav class="navbar navbar-expand-lg navbar-dark shadow-sm sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold text-info" href="index.html">UniLostFound</a>
            <button class="navbar-expand-lg navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto fw-semibold">
                    <li class="nav-item"><a class="nav-link text-white-50" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link active text-info" href="report.html">Lost & Found</a></li>
                    <li class="nav-item"><a class="nav-link text-white-50" href="dashboard.html">Dashboard</a></li>
                    <li class="nav-item"><a class="nav-link text-white-50" href="auth.html">Login</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Main Content: Lost and Found Form -->
    <main class="container my-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card card-custom p-4 shadow-lg rounded-3">
                    <h2 class="text-center fw-bold text-info mb-4">Report Lost & Found Item</h2>
                    <p class="text-center text-white-50 mb-4">Fill out the form below to report a lost or found item within the campus community.</p>
                    
                    <form id="reportForm">
                        <!-- Item Name -->
                        <div class="mb-3">
                            <label for="itemName" class="form-label fw-bold">Item Name *</label>
                            <input type="text" class="form-control" id="itemName" placeholder="e.g., Scientific Calculator, Black Laptop Bag" required>
                        </div>

                        <!-- Category Selection -->
                        <div class="mb-3">
                            <label for="itemStatus" class="form-label fw-bold">Report Type *</label>
                            <select class="form-select" id="itemStatus" required>
                                <option value="" selected disabled>Choose... Lost or Found?</option>
                                <option value="Lost">I Lost Something</option>
                                <option value="Found">I Found Something</option>
                            </select>
                        </div>

                        <!-- Category Type -->
                        <div class="mb-3">
                            <label for="itemCategory" class="form-label fw-bold">Category *</label>
                            <select class="form-select" id="itemCategory" required>
                                <option value="" selected disabled>Select Category</option>
                                <option value="Electronics">Electronics (Laptop, Phone, Charger)</option>
                                <option value="Documents">Documents (ID Card, Record Book)</option>
                                <option value="Books">Books / Stationery</option>
                                <option value="Clothing">Clothing / Bags</option>
                                <option value="Other">Other</option>
                            </select>
                        </div>

                        <!-- Date and Location -->
                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label for="reportDate" class="form-label fw-bold">Date *</label>
                                <input type="date" class="form-control" id="reportDate" required>
                            </div>
                            <div class="col-md-6 mb-3">
                                <label for="itemLocation" class="form-label fw-bold">Location *</label>
                                <input type="text" class="form-control" id="itemLocation" placeholder="e.g., Main Library, IT Faculty Room 2" required>
                            </div>
                        </div>

                        <!-- Description -->
                        <div class="mb-3">
                            <label for="itemDescription" class="form-label fw-bold">Description *</label>
                            <textarea class="form-control" id="itemDescription" rows="4" placeholder="Provide details like color, brand, unique marks..." required></textarea>
                        </div>

                        <!-- Image Upload Component -->
                        <div class="mb-4">
                            <label for="itemImage" class="form-label fw-bold">Upload Image (Optional)</label>
                            <input type="file" class="form-control" id="itemImage" accept="image/*">
                        </div>

                        <!-- Submit Button -->
                        <div class="d-grid">
                            <button type="submit" class="btn btn-info fw-bold text-dark py-2">Submit Report</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </main>

    <!-- Footer (Present on all pages) -->
    <footer class="bg-dark text-center text-white py-3 mt-5 border-top border-secondary">
        <p class="mb-0 text-white-50">© 2026 UniLostFound - Rajarata University of Sri Lanka. All Rights Reserved.</p>
    </footer>

    <!-- Bootstrap 5 JS Bundle -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS JavaScript Feature -->
    <script src="assets/js/main.js"></script>
</body>
</html>
